apiVersion: apps/v1
kind: Deployment
metadata:
  name: tic-tac-toe-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tic-tac-toe
  template:
    metadata:
      labels:
        app: tic-tac-toe
    spec:
      containers:
      - name: game-container
        image: DOCKER_USER_PLACEHOLDER/tic-tac-toe-app:TAG_PLACEHOLDER
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        env:
        - name: APP_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: tic-tac-toe-config
              key: APP_ENV
        - name: ADMIN_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: tic-tac-toe-secret
              key: ADMIN_TOKEN
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
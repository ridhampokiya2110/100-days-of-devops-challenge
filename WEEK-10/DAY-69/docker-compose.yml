version: '3.8'

services:
  my-db:
    image: mysql:8.0
    container_name: day69-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: supersecret
      MYSQL_DATABASE: wordpress_db
    volumes:
      - day69-db-data:/var/lib/mysql

  my-wordpress:
    depends_on:
      - my-db
    image: wordpress:latest
    container_name: day69-wordpress
    ports:
      - "8082:80"  
    restart: always
    environment:
      WORDPRESS_DB_HOST: my-db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: supersecret
      WORDPRESS_DB_NAME: wordpress_db

volumes:
  day69-db-data: